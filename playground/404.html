<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFBF4">
  <title>Faceroll — Page not found</title>
  <!-- Hosts such as Cloudflare Pages serve this file at the requested path, so every URL here is root-absolute. Relative paths would resolve against the missing URL and 404 again. -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="preload" href="/assets/fonts/quicksand-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <img class="logo logo-on-light" src="/assets/logo-color.svg" alt="Faceroll" width="214" height="44">
      <img class="logo logo-on-dark" src="/assets/logo-reversed.svg" alt="Faceroll" width="214" height="44">
      <span class="version">playground</span>
    </a>
  </header>
  <main class="notfound">
    <p class="notfound-face" aria-hidden="true">(・_・;)</p>
    <h1>That page rolled away</h1>
    <p class="subtitle">The playground lives on one page. Everything else is a miss.</p>
    <a class="primary-button notfound-action" href="/">Back to the playground</a>
  </main>
</body>
</html>
