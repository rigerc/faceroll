name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [package.json]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Validate release version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const tag = process.env.REF_TYPE === 'tag' ? process.env.REF_NAME : `v${pkg.version}`;
          const semver = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*)?$/;
          const match = tag.match(semver);
          if (!match || tag !== `v${pkg.version}`) {
            throw new Error(`Tag ${tag} must be a semantic version matching v${pkg.version}`);
          }
          if (lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw new Error('package-lock.json must match package.json version');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nprerelease=${Boolean(match[4])}\n`);
          NODE

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  release:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # The optional MCP server requires Node 24 or newer.
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm --prefix mcp ci
      - run: npm run build:playground
      - run: npm --prefix mcp run build
      - name: Package release assets
        run: |
          mkdir release-assets
          npm pack --pack-destination release-assets
          (cd mcp && npm pack --pack-destination ../release-assets)
          tar -czf release-assets/faceroll-playground.tar.gz -C playground-dist .
          (cd release-assets && sha256sum ./*.tgz ./*.tar.gz > SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          args=(--generate-notes --title "$RELEASE_TAG")
          if [[ "$REF_TYPE" == "tag" ]]; then
            args+=(--verify-tag)
          else
            # Create the tag at the exact tested release commit, even if main advances.
            args+=(--target "$GITHUB_SHA")
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release-assets/* "${args[@]}"
